# /etc/nginx/sites-available/bidules : reverse proxy HTTPS (certificat Let's Encrypt) vers le serveur Node sur 127.0.0.1:3000.
# Le point essentiel pour le WebSocket : Upgrade/Connection et un read_timeout long (sinon Nginx coupe à 60 s).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name jeu.example.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name jeu.example.org;

  ssl_certificate     /etc/letsencrypt/live/jeu.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jeu.example.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;       # le serveur envoie un ping toutes les 20 s
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128k;      # les niveaux partagés font 64 Ko au plus
  }
}
